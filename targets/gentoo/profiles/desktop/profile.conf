# desktop (neverland): AMD 9800X3D / RTX 5080. Sole Gentoo machine —
# the laptop runs Arch, see targets/arch.
# Plain sh vars, sourced by provision.sh and the numbered scripts.
# shellcheck disable=SC2034
WANT_VIRT=1
# gets the video/libvirt/kvm groups; falls back to $SUDO_USER when unset
VIRT_USER=leon
WANT_OLLAMA=1
EXPECT_GPU=nvidia
EXPECT_CHASSIS=desktop

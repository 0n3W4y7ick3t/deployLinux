# Override for the main tree. Everything else still comes from
# /usr/share/portage/config/repos.conf; only the mirror rotation is pinned.
#
# The default rsync.gentoo.org resolves to an Asia set here that includes
# linux.cs.nctu.edu.tw (140.113.17.5). That mirror hides every package
# directory named "project" (an unanchored exclude guarding its own
# project/trace), so gemato rejects its tree and the sync fails with
# "Manifest mismatch for app-vim/project/Manifest" (seen 2026-10-14).
# rsync.jp.gentoo.org serves a complete tree from every address in the
# rotation; rsync.tw and rsync.asia both include the broken mirror.
[gentoo]
sync-uri = rsync://rsync.jp.gentoo.org/gentoo-portage

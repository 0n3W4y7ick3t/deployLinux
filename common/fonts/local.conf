<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    The vendored FiraCode Nerd Font is patched with fontfreeze, which renames
    the family to "FiraCode Nerd Font Freeze". Configs written against the
    stock name ("FiraCode Nerd Font" in rice's waybar style.css, the wmenu-run
    bind and the keybindings doc) would otherwise fall through to Liberation
    Sans, which renders with the wrong metrics and no Nerd Font glyphs.

    Alias the stock name onto the installed one so both spellings resolve.
  -->
  <alias binding="same">
    <family>FiraCode Nerd Font</family>
    <prefer>
      <family>FiraCode Nerd Font Freeze</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>FiraCode Nerd Font Mono</family>
    <prefer>
      <family>FiraCode Nerd Font Freeze</family>
    </prefer>
  </alias>

  <!-- Emoji fallback, so the bar's status glyphs render in colour. -->
  <alias>
    <family>FiraCode Nerd Font Freeze</family>
    <default>
      <family>Noto Color Emoji</family>
    </default>
  </alias>
</fontconfig>
